<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개발 서비스 통합 제어 센터 | Service Controller Panel</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              brown: {
                light: '#463f37',
                DEFAULT: '#36302a',
                dark: '#2c2722',
              },
              gold: {
                DEFAULT: '#C5A059',
                dark: '#A68345',
              }
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
    }
    .terminal-font {
      font-family: 'Fira Code', 'Courier New', monospace;
    }
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1e1b18;
    }
    ::-webkit-scrollbar-thumb {
      background: #C5A059;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-[#2c2722] text-[#F8FAFC] min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-[#36302a] border-b border-[#C5A059]/20 py-5 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3 text-left">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#C5A059] to-[#A68345] flex items-center justify-center border border-[#C5A059]/30 shadow-md">
          <i data-lucide="sliders" class="w-5 h-5 text-[#2c2722]"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-[#C5A059] font-serif tracking-wide">개발 서비스 통합 제어 센터</h1>
          <p class="text-xs text-gray-400 font-medium">Local Services Management Control Room</p>
        </div>
      </div>
      <div class="flex items-center gap-2 bg-[#2c2722] px-3.5 py-1.5 rounded-lg border border-gray-700/50 text-xs">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-gray-300 font-semibold">컨트롤러 정상 작동 중 (Port: 9000)</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-8 flex flex-col gap-8">
    
    <!-- Grid of Services -->
    <div>
      <h2 class="text-lg font-bold text-[#C5A059] font-serif border-b border-[#C5A059]/25 pb-2 mb-6 flex items-center gap-2">
        <i data-lucide="monitor" class="w-5 h-5"></i> 등록된 로컬 서비스 목록
      </h2>

      <div id="services-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Loader / Placeholder -->
        <div class="col-span-full py-12 text-center text-gray-500 font-serif">
          등록된 서비스를 조회하고 있습니다...
        </div>
      </div>
    </div>

    <!-- Registration Panel -->
    <div class="bg-[#36302a] border border-[#C5A059]/15 rounded-2xl p-6 shadow-xl text-left max-w-3xl">
      <h3 class="text-md font-bold text-[#C5A059] font-serif border-b border-[#C5A059]/15 pb-2.5 mb-5 flex items-center gap-2">
        <i data-lucide="plus-circle" class="w-4 h-4"></i> 새 로컬 서비스 등록
      </h3>
      
      <form id="add-service-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5 md:col-span-2">
          <label class="text-xs text-gray-400 font-semibold">서비스 이름</label>
          <input type="text" id="new-name" required placeholder="예: 고객 관리 시스템" class="bg-[#2c2722] border border-gray-700 text-sm text-gray-200 rounded-lg p-2.5 focus:outline-none focus:border-[#C5A059]">
        </div>
        <div class="flex flex-col gap-1.5 md:col-span-2">
          <label class="text-xs text-gray-400 font-semibold">작업 디렉토리 경로 (CWD)</label>
          <input type="text" id="new-cwd" required placeholder="예: c:\실습\DEV\CustomerService" class="bg-[#2c2722] border border-gray-700 text-sm text-gray-200 rounded-lg p-2.5 focus:outline-none focus:border-[#C5A059] font-mono text-xs">
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs text-gray-400 font-semibold">실행 명령어 (Command)</label>
          <input type="text" id="new-command" required placeholder="예: node 또는 python" class="bg-[#2c2722] border border-gray-700 text-sm text-gray-200 rounded-lg p-2.5 focus:outline-none focus:border-[#C5A059]">
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs text-gray-400 font-semibold">실행 인수 (Arguments)</label>
          <input type="text" id="new-args" placeholder="예: app.js 또는 index.js" class="bg-[#2c2722] border border-gray-700 text-sm text-gray-200 rounded-lg p-2.5 focus:outline-none focus:border-[#C5A059]">
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs text-gray-400 font-semibold">포트 번호 (Port)</label>
          <input type="number" id="new-port" required placeholder="예: 3000" class="bg-[#2c2722] border border-gray-700 text-sm text-gray-200 rounded-lg p-2.5 focus:outline-none focus:border-[#C5A059] font-mono">
        </div>
        <div class="flex items-end">
          <button type="submit" class="w-full bg-[#C5A059] hover:bg-[#A68345] text-[#2c2722] font-bold text-sm py-2.5 rounded-lg transition-all flex items-center justify-center gap-1.5 shadow-md">
            <i data-lucide="plus" class="w-4 h-4"></i> 신규 서비스 등록
          </button>
        </div>
      </form>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-[#2c2722] border-t border-[#36302a] py-6 text-center text-xs text-gray-500 font-mono">
    &copy; 2026 DEVELOPMENT SERVICE CONTROLLER. All Rights Reserved.
  </footer>

  <script>
    const API_BASE = '/api/services';
    let serviceLogsPollIntervals = new Map(); // id -> intervalId

    // Fetch and render services
    async function loadServices() {
      try {
        const res = await fetch(API_BASE);
        const services = await res.json();
        renderServices(services);
      } catch (err) {
        console.error('Failed to load services:', err);
      }
    }

    // Render HTML Cards
    function renderServices(servicesList) {
      const grid = document.getElementById('services-grid');
      grid.innerHTML = '';

      if (servicesList.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-12 text-center text-gray-500 font-serif">등록된 서비스가 없습니다.</div>';
        return;
      }

      servicesList.forEach(s => {
        const isRunning = s.status === 'RUNNING';
        const isStarting = s.status === 'STARTING';
        
        let statusBadge = '';
        if (isRunning) {
          statusBadge = `<span class="flex items-center gap-1.5 bg-emerald-950 text-emerald-400 border border-emerald-500/20 px-2.5 py-0.5 rounded-full text-[11px] font-bold">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> 구동 중
          </span>`;
        } else if (isStarting) {
          statusBadge = `<span class="flex items-center gap-1.5 bg-amber-950 text-amber-400 border border-amber-500/20 px-2.5 py-0.5 rounded-full text-[11px] font-bold">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span> 시작 중...
          </span>`;
        } else {
          statusBadge = `<span class="flex items-center gap-1.5 bg-gray-900 text-gray-400 border border-gray-700/30 px-2.5 py-0.5 rounded-full text-[11px] font-bold">
            정지됨
          </span>`;
        }

        const deleteButton = (s.id !== 'philosophy' && s.id !== 'flight') 
          ? `<button onclick="deleteService('${s.id}')" class="p-1 text-gray-500 hover:text-red-400 rounded hover:bg-[#2c2722] transition-all" title="서비스 삭제">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
             </button>`
          : '';

        const card = document.createElement('div');
        card.className = `bg-[#36302a] border rounded-2xl shadow-lg p-5 flex flex-col gap-4 text-left transition-all duration-300 ${
          isRunning ? 'border-emerald-500/20 shadow-emerald-500/5' : 'border-[#C5A059]/10'
        }`;

        card.innerHTML = `
          <!-- Card Header -->
          <div class="flex items-start justify-between gap-2 border-b border-[#C5A059]/10 pb-3">
            <div>
              <h3 class="font-bold text-white text-base leading-snug">${s.name}</h3>
              <div class="text-[10px] text-gray-400 font-mono mt-1 select-all truncate max-w-[280px] sm:max-w-none" title="${s.cwd}">
                CWD: ${s.cwd}
              </div>
            </div>
            <div class="flex items-center gap-2">
              ${statusBadge}
              ${deleteButton}
            </div>
          </div>

          <!-- Configuration & Open shortcut -->
          <div class="grid grid-cols-2 gap-2 text-xs text-gray-300 bg-[#2c2722]/50 p-2.5 rounded-lg border border-gray-700/20 font-mono">
            <div><span class="text-gray-500">명령어:</span> ${s.command} ${s.args}</div>
            <div><span class="text-gray-500">동작 포트:</span> ${s.port}</div>
          </div>

          <!-- Action Buttons -->
          <div class="flex items-center gap-3">
            <button onclick="startService('${s.id}')" ${isRunning || isStarting ? 'disabled' : ''} 
              class="flex-1 py-2 rounded-xl text-xs font-bold transition-all shadow flex items-center justify-center gap-1 ${
                isRunning || isStarting
                  ? 'bg-gray-800 text-gray-600 cursor-not-allowed border border-gray-900'
                  : 'bg-[#C5A059] hover:bg-[#A68345] text-[#2c2722] hover:scale-[1.01]'
              }">
              <i data-lucide="play" class="w-3.5 h-3.5"></i> 실행 (Start)
            </button>
            <button onclick="stopService('${s.id}')" ${!isRunning && !isStarting ? 'disabled' : ''} 
              class="flex-1 py-2 rounded-xl text-xs font-bold transition-all shadow flex items-center justify-center gap-1 ${
                !isRunning && !isStarting
                  ? 'bg-gray-800 text-gray-600 cursor-not-allowed border border-gray-900'
                  : 'bg-red-950/70 border border-red-500/20 text-red-400 hover:bg-red-900/60'
              }">
              <i data-lucide="square" class="w-3.5 h-3.5"></i> 종료 (Stop)
            </button>
            <a href="http://localhost:${s.port}" target="_blank" 
              class="py-2 px-4 bg-white hover:bg-slate-100 text-[#2c2722] text-xs font-bold rounded-xl border border-gray-300 shadow flex items-center justify-center gap-1 transition-all">
              <i data-lucide="external-link" class="w-3.5 h-3.5"></i> 접속 (Open)
            </a>
          </div>

          <!-- Live Log Console -->
          <div class="flex flex-col gap-1.5">
            <div class="flex items-center justify-between text-[10px] text-gray-400 font-semibold px-0.5">
              <span class="flex items-center gap-1"><i data-lucide="terminal" class="w-3 h-3 text-[#C5A059]"></i> 실시간 출력 로그</span>
              <button onclick="clearConsole('${s.id}')" class="hover:text-white transition-colors">로그 비우기</button>
            </div>
            <div id="log-${s.id}" class="bg-[#1a1715] border border-gray-800/80 rounded-xl p-3 h-36 overflow-y-auto text-left terminal-font text-[10px] text-emerald-500 leading-relaxed whitespace-pre-wrap select-text">
              [시스템] 로그 출력을 기다리는 중...
            </div>
          </div>
        `;
        grid.appendChild(card);

        // Start log polling if not active
        if (!serviceLogsPollIntervals.has(s.id)) {
          pollLogs(s.id);
          const intervalId = setInterval(() => pollLogs(s.id), 1500);
          serviceLogsPollIntervals.set(s.id, intervalId);
        }
      });
      lucide.createIcons();
    }

    // Polling logs
    async function pollLogs(id) {
      try {
        const res = await fetch(`${API_BASE}/${id}/logs`);
        const data = await res.json();
        const consoleEl = document.getElementById(`log-${id}`);
        if (!consoleEl) return;

        if (data.logs.length === 0) {
          consoleEl.innerHTML = '<span class="text-gray-600">[로그 없음]</span>';
          return;
        }

        const currentText = data.logs.join('\n');
        
        // Only update DOM and scroll if logs actually changed to prevent jitter
        if (consoleEl.dataset.lastText !== currentText) {
          consoleEl.innerHTML = currentText;
          consoleEl.dataset.lastText = currentText;
          // Auto-scroll to bottom
          consoleEl.scrollTop = consoleEl.scrollHeight;
        }
      } catch (err) {
        console.error(`Failed to poll logs for ${id}:`, err);
      }
    }

    // Action handlers
    async function startService(id) {
      try {
        const res = await fetch(`${API_BASE}/${id}/start`, { method: 'POST' });
        const data = await res.json();
        console.log('Start response:', data);
        setTimeout(loadServices, 500);
      } catch (err) {
        alert('서비스 시작 명령 전송 실패');
      }
    }

    async function stopService(id) {
      try {
        const res = await fetch(`${API_BASE}/${id}/stop`, { method: 'POST' });
        const data = await res.json();
        console.log('Stop response:', data);
        setTimeout(loadServices, 500);
      } catch (err) {
        alert('서비스 종료 명령 전송 실패');
      }
    }

    async function deleteService(id) {
      if (!confirm('서비스 등록을 취소하시겠습니까?')) return;
      try {
        // Clear log poll interval
        if (serviceLogsPollIntervals.has(id)) {
          clearInterval(serviceLogsPollIntervals.get(id));
          serviceLogsPollIntervals.delete(id);
        }
        
        await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
        loadServices();
      } catch (err) {
        alert('삭제 전송 실패');
      }
    }

    function clearConsole(id) {
      const consoleEl = document.getElementById(`log-${id}`);
      if (consoleEl) {
        consoleEl.innerHTML = '[시스템] 로그가 초기화되었습니다.';
        consoleEl.dataset.lastText = '';
      }
    }

    // Form Submission
    document.getElementById('add-service-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const payload = {
        name: document.getElementById('new-name').value,
        cwd: document.getElementById('new-cwd').value,
        command: document.getElementById('new-command').value,
        args: document.getElementById('new-args').value,
        port: parseInt(document.getElementById('new-port').value, 10)
      };

      try {
        const res = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error('Registration failed');
        
        // Reset form
        document.getElementById('add-service-form').reset();
        
        // Reload list
        loadServices();
      } catch (err) {
        alert('서비스 등록 실패: ' + err.message);
      }
    });

    // Initial setup
    loadServices();
    
    // Periodically poll service statuses
    setInterval(loadServices, 2000);
  </script>
</body>
</html>
